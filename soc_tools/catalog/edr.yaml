category:
  id: edr
  name: "Endpoint Detection and Response"
  description: "EDR platform providing visibility into process execution, file activity, and device telemetry across endpoints."

data_scope:
  - process_events
  - device_events
  - network_events
  - login_events
  - employees
  - devices

functions:
  get_process_tree:
    capability: edr.get_process_tree
    description: "Get the process execution tree for a device or user, showing parent-child process relationships and command lines."
    parameters:
      device_id:
        type: string
        required: false
        description: "Device ID to get process tree for"
      employee_id:
        type: string
        required: false
        description: "Employee ID to get process tree for"
      process_name:
        type: string
        required: false
        description: "Filter to a specific process name"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

  search_process_by_hash:
    capability: edr.search_process_by_hash
    description: "Search for all executions of a process by its file hash (SHA256). Shows which hosts ran the binary and when."
    parameters:
      hash:
        type: string
        required: true
        description: "SHA256 or other file hash to search for"

  search_process_by_command:
    capability: edr.search_process_by_command
    description: "Search for processes by command line pattern. Useful for finding specific scripts, encoded commands, or suspicious arguments."
    parameters:
      command_pattern:
        type: string
        required: true
        description: "Substring to search in command line arguments"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

  get_host_timeline:
    capability: edr.get_host_timeline
    description: "Get a chronological timeline of all activity on a specific endpoint, including process executions, USB connections, and software installs."
    parameters:
      device_id:
        type: string
        required: true
        description: "Device ID to get timeline for"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"
      limit:
        type: integer
        required: false
        description: "Maximum events to return (default 100)"

  get_device_events:
    capability: edr.get_device_events
    description: "Get device-related events such as USB connections, software installs/uninstalls, and bluetooth connections."
    parameters:
      employee_id:
        type: string
        required: false
        description: "Filter by employee ID"
      device_id:
        type: string
        required: false
        description: "Filter by device ID"
      action:
        type: string
        required: false
        enum: [usb_connected, usb_disconnected, software_install, software_uninstall, bluetooth_connect, bluetooth_disconnect]
        description: "Filter by action type"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

  detect_suspicious_processes:
    capability: edr.detect_suspicious_processes
    description: "Detect executions of known suspicious processes (LOLBins, hacking tools). Returns all matching events with full command lines."
    parameters:
      suspicious_names:
        type: array
        items:
          type: string
        required: false
        description: "Custom list of suspicious process names. Default includes common LOLBins like powershell.exe, certutil.exe, etc."
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

  get_network_events:
    capability: edr.get_network_events
    description: "Get all network events including firewall logs, connection events, and traffic data. Shows source/destination IPs, ports, protocols, and actions."
    parameters:
      source_ip:
        type: string
        required: false
        description: "Filter by source IP address"
      destination_ip:
        type: string
        required: false
        description: "Filter by destination IP address"
      action:
        type: string
        required: false
        description: "Filter by action (e.g. 'allow', 'deny', 'drop')"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"
      limit:
        type: integer
        required: false
        description: "Maximum results to return (default 100)"

  search_network_events:
    capability: edr.search_network_events
    description: "Search network events by IP address or URL pattern. Finds all network connections involving the specified indicator."
    parameters:
      ip:
        type: string
        required: false
        description: "IP address to search for in source or destination fields"
      url:
        type: string
        required: false
        description: "URL or domain pattern to search for in network event descriptions"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"
      limit:
        type: integer
        required: false
        description: "Maximum results to return (default 100)"

platforms:
  crowdstrike:
    name: "CrowdStrike Falcon"
    vendor: "CrowdStrike"
    prefix: "cs"
    description: "Full-featured EDR platform providing visibility into process execution, file activity, and device telemetry across endpoints."
    functions:
      - get_process_tree
      - search_process_by_hash
      - search_process_by_command
      - get_host_timeline
      - get_device_events
      - detect_suspicious_processes
      - get_network_events
      - search_network_events
