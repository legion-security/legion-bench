category:
  id: siem
  name: "Security Information and Event Management"
  description: "SIEM platform for searching, monitoring, and analyzing machine-generated data from security event logs."

data_scope:
  - login_events
  - email_events
  - file_events
  - admin_actions
  - app_events
  - process_events
  - mfa_events
  - device_events
  - print_events
  - network_events
  - employees
  - devices
  - subnets

functions:
  run_query:
    capability: siem.run_query
    description: >
      Run a SQL query on any table in the SIEM database.
      Available tables and their columns:

      EVENT TABLES:
      - login_events (id, employee_id, ts, ip, method, success, app, geo, user_agent, device_id, known_device, failure_reason)
      - email_events (id, employee_id, ts, direction, sender, recipients, cc, bcc, subject, content, external, attachment_types, contains_url, url_clicked)
      - file_events (id, employee_id, ts, action, path, system, destination, size_bytes, count, label, category, description)
      - admin_actions (id, employee_id, ts, system, action, approved_by, details)
      - app_events (id, employee_id, ts, app, action, resource_type, resource_name, description, success)
      - process_events (id, employee_id, ts, process_name, action, parent_process, command_line, pid, hash, path, user_context, integrity_level, device_id)
      - mfa_events (id, employee_id, ts, action, device_name, method, count, app, ip, success)
      - device_events (id, employee_id, ts, action, device_type, vendor, product, serial, volume_label, capacity_gb, software_name, software_version)
      - print_events (id, employee_id, ts, printer_name, document_name, pages, copies, color, duplex, paper_size, job_id, status)
      - network_events (id, network_id, ts, source_ip, destination_ip, destination_port, protocol, action, direction, username, auth, bytes_sent, bytes_received, description)

      REFERENCE TABLES:
      - employees (id, email, display_name, department_id, department, title, manager_id, location)
      - devices (id, hostname, os, owner_user_id, ip_address, network_id)
      - subnets (id, cidr, location, name)

      CLOUD TABLES:
      - cloud_events (id, event_id, ts, provider, instance_id, region, account_id, identity, identity_type, event_source, event_name, event_category, read_only, source_ip, user_agent, request_parameters, response_status, error_code, error_message, resources)
      - cloud_instances (instance_id, provider, account_id, region, zone, image, instance_type, tags, vpc, subnet, private_ip, public_ip, security_groups, iam_role, service_principal, permissions)
      - cloud_containers (id, provider, cluster, node, namespace, pod, container, image, labels)
      - cloud_vulnerabilities (id, resource_id, resource_type, provider, severity, cve_id, title, description, package_name, package_version, fixed_version, detected_at, status)
      - cloud_misconfigurations (id, resource_id, resource_type, provider, severity, rule_id, title, description, category, compliance_framework, detected_at, status)
      - cloud_threats (id, resource_id, resource_type, identity, provider, severity, threat_type, title, description, source_ip, destination_ip, action, detected_at, status, details)

      Cloud API activity (CloudTrail, Azure Activity Log, GCP Audit Log) lives in cloud_events, keyed by identity (an IAM role or service principal) rather than employee_id. Join cloud_instances on instance_id to resolve a resource to its network and IAM context.

      Use standard SQL SELECT syntax. JOIN employees or devices tables to correlate events with user/device info.
      Example: SELECT * FROM login_events WHERE employee_id = 'u_0042' AND success = 0
      Example: SELECT le.*, e.display_name FROM login_events le JOIN employees e ON le.employee_id = e.id WHERE le.ip = '185.234.72.100'
      Example: SELECT ts, identity, event_name, source_ip, response_status FROM cloud_events WHERE identity LIKE '%svc-backup%' ORDER BY ts
    parameters:
      query:
        type: string
        required: true
        description: "SQL SELECT query to execute on the SIEM database. Only SELECT queries are allowed."
      limit:
        type: integer
        required: false
        description: "Maximum results to return (default 100, max 1000)"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound (e.g. '2024-01-15T00:00:00Z'). Automatically adds a ts >= filter to the query if the query doesn't already filter on ts."
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound (e.g. '2024-02-15T00:00:00Z'). Automatically adds a ts <= filter to the query if the query doesn't already filter on ts."

  search_app_events:
    capability: siem.search_app_events
    description: >
      Search application activity events (Slack, GitHub, Salesforce, Jira, etc.) with flexible filters.
      Returns matching events with employee display names. Use this to investigate user activity
      across enterprise applications — e.g. find all actions by a user in a specific app,
      search for failed actions, or look for activity on specific resources.
    parameters:
      employee_id:
        type: string
        required: false
        description: "Filter by employee ID (e.g. 'u_0042')"
      app:
        type: string
        required: false
        description: "Filter by application name (e.g. 'Slack', 'GitHub', 'Salesforce', 'Jira', 'Okta')"
      action:
        type: string
        required: false
        description: "Filter by action (e.g. 'upload_file', 'send_message', 'push_commit', 'export_data')"
      resource_type:
        type: string
        required: false
        description: "Filter by resource type (e.g. 'file', 'message', 'issue', 'pull_request')"
      resource_name:
        type: string
        required: false
        description: "Filter by resource name (substring match)"
      success:
        type: boolean
        required: false
        description: "Filter by success (true) or failure (false)"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"
      limit:
        type: integer
        required: false
        description: "Maximum results to return (default 50, max 500)"

  search_dashboard:
    capability: siem.search_dashboard
    description: "Run a pre-built search dashboard for a user or device. Returns a comprehensive summary of all recent activity including logins, emails, file operations, admin actions, app events, process executions, MFA events, device events, print activity, and more."
    parameters:
      employee_id:
        type: string
        required: false
        description: "Employee ID to generate dashboard for"
      device_id:
        type: string
        required: false
        description: "Device ID to generate dashboard for"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound (e.g. '2024-01-15T00:00:00Z'). Defaults to 30 days ago if not specified."
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound (e.g. '2024-02-15T00:00:00Z'). Defaults to now if not specified."

platforms:
  splunk:
    name: "Splunk Enterprise Security"
    vendor: "Splunk"
    prefix: "splunk"
    description: "SIEM platform for searching, monitoring, and analyzing machine-generated data from security event logs using SQL queries."
    functions:
      - run_query
      - search_app_events
      - search_dashboard
