category:
  id: email_security
  name: "Email Security Gateway"
  description: "Email security gateway providing message trace, attachment analysis, phishing detection, and sender intelligence."

data_scope:
  - email_events
  - employees
  - mailboxes
  - mailbox_members

functions:
  search_emails:
    capability: email_gateway.search_emails
    description: "Search emails by any combination of indicators: sender, subject, recipient, IP address, URL, or attachment filename. When multiple filters are provided, they are combined with AND logic to narrow results."
    parameters:
      sender:
        type: string
        required: false
        description: "Filter by sender email address"
      subject_contains:
        type: string
        required: false
        description: "Search for text in the email subject"
      recipient:
        type: string
        required: false
        description: "Filter by recipient email address"
      ip:
        type: string
        required: false
        description: "Filter by IP address found in email headers or content"
      url:
        type: string
        required: false
        description: "Filter by URL found in email body"
      filename:
        type: string
        required: false
        description: "Filter by attachment filename"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"
      limit:
        type: integer
        required: false
        description: "Maximum results (default 50)"

  get_email_attachments:
    capability: email_gateway.get_email_attachments
    description: "Search for email attachments by sender, filename, or file type. Returns emails containing matching attachments."
    parameters:
      sender:
        type: string
        required: false
        description: "Filter by sender email address"
      filename_contains:
        type: string
        required: false
        description: "Search for text in attachment filenames"
      file_type:
        type: string
        required: false
        description: "Filter by file type (e.g. 'pdf', 'exe', 'docx', 'zip')"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

  get_sender_summary:
    capability: email_gateway.get_sender_summary
    description: "Profile a sender email address. Shows message count, recipients, subjects, whether they are internal, and attachment statistics."
    parameters:
      sender:
        type: string
        required: true
        description: "Email address to profile"

  find_phishing_indicators:
    capability: email_gateway.find_phishing_indicators
    description: "Find external emails with potential phishing indicators such as URLs, attachments, and urgency language in subjects."
    parameters:
      sender_domain:
        type: string
        required: false
        description: "Filter to a specific sender domain (e.g. 'evil-corp.com')"
      time_start:
        type: string
        required: false
        description: "ISO 8601 timestamp lower bound"
      time_end:
        type: string
        required: false
        description: "ISO 8601 timestamp upper bound"

platforms:
  defender_o365:
    name: "Microsoft Defender for Office 365"
    vendor: "Microsoft"
    prefix: "defender"
    description: "Email security gateway providing message trace, attachment analysis, phishing detection, and sender intelligence for Office 365 email."
    functions:
      - search_emails
      - get_email_attachments
      - get_sender_summary
      - find_phishing_indicators
