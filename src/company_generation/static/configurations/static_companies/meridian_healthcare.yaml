company:
  id: meridian_healthcare
  name: Meridian Healthcare Partners
  domain: meridianhcp.com
  description: >
    Meridian Healthcare Partners is a regional healthcare network operating hospitals,
    outpatient clinics, and specialty care centers in the northeastern United States.
    They provide a full range of medical services including primary care, surgery,
    radiology, pharmacy, and laboratory services. The organization is HIPAA-regulated,
    uses electronic health record (EHR) systems extensively, and employs physicians,
    nurses, and allied health professionals alongside administrative and IT staff.
  locations:
    - US-BOS-HQ
    - US-HFD
    - US-PVD

