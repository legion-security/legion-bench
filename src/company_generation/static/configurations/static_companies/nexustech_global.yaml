company:
  id: nexustech_global
  name: NexusTech Global
  domain: nexustech.io
  description: >
    NexusTech Global is a mid-size enterprise SaaS company that builds cloud-based developer
    tools and API infrastructure products. Their flagship platform provides API gateway,
    observability, and CI/CD pipeline services to thousands of B2B customers worldwide.
    The company is engineering-heavy with a strong data science practice, and operates
    across multiple global offices with a hybrid work model.
  locations:
    - US-SF-HQ
    - US-NYC
    - US-SEA
    - US-AUS
    - UK-LON
    - DE-BER
    - NL-AMS
    - IL-TLV
    - IN-BLR
    - IN-HYD
    - SG-SIN
    - JP-TKY
    - AU-SYD

